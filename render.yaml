services:
  - type: web
    name: monty-saas-api
    runtime: python
    rootDir: monty-saas/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'if [ -n "$DATABASE_URL" ]; then alembic upgrade head; fi && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEV_AUTH
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://monty-saas-web.onrender.com

  - type: web
    name: monty-saas-web
    runtime: node
    rootDir: monty-saas/frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port ${PORT:-3000}
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://monty-saas-api.onrender.com
