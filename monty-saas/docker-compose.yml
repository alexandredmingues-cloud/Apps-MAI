services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monty_dev_password}
      POSTGRES_DB: monty_saas
    ports:
      - "5432:5432"
    volumes:
      - monty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monty -d monty_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://monty:${POSTGRES_PASSWORD:-monty_dev_password}@postgres:5432/monty_saas
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["arq", "app.workers.redis_tasks.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://monty:${POSTGRES_PASSWORD:-monty_dev_password}@postgres:5432/monty_saas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  monty_pg_data:
