name: Monty CI — Tri-Platform Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-python:
    name: Backend FastAPI & Domain Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monty-saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources & run unit tests
        env:
          ENVIRONMENT: development
          ENABLE_DEV_AUTH: "true"
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

  frontend-nextjs:
    name: Frontend Next.js Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monty-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monty-saas/frontend/package-lock.json
      - name: Install & verify frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint || true
          NODE_ENV=production npm run build

  android-kotlin:
    name: Android Kotlin Compile & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android & run JVM unit tests
        run: gradle :app:testDebugUnitTest
