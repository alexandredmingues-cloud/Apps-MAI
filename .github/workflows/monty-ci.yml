name: MON-AGENT CI — Tri-Platform Verification

on:
  push:
    branches: [main, develop, audit/production-readiness-2026-11, brand/mon-agent-identity-2026, 'fix/**']
  pull_request:
    branches: [main, develop, audit/production-readiness-2026-11, brand/mon-agent-identity-2026]

permissions:
  contents: read

concurrency:
  group: monty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: Backend FastAPI & Domain Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: monty-saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: monty-saas/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply all PostgreSQL migrations on a clean PostgreSQL 16 database
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@localhost:5432/monagent_test
        run: alembic upgrade head

      - name: Compile Python sources & run complete test suite
        env:
          ENVIRONMENT: development
          ENABLE_DEV_AUTH: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monagent_test
        run: |
          python -m compileall -q app tests
          python -m pytest -q

      - name: PostgreSQL backup, checksum and restore smoke test
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monagent_test
          BACKUP_DIR: ${{ runner.temp }}/monagent-backup-test
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_restore_probe (id integer PRIMARY KEY, payload text NOT NULL)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO backup_restore_probe VALUES (1, 'restore-ok')"
          # Use the same PostgreSQL client version as the service image when available.
          if command -v pg_dump >/dev/null 2>&1; then
            pg_dump "$DATABASE_URL" --format=custom --file="$BACKUP_DIR/monagent.dump"
          else
            docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
              pg_dump "postgresql://postgres:postgres@localhost:5432/monagent_test" \
              --format=custom --file=/tmp/monagent.dump
            docker cp "$(docker ps -aq --filter ancestor=postgres:16 | head -1)":/tmp/monagent.dump "$BACKUP_DIR/monagent.dump" 2>/dev/null || true
          fi
          test -s "$BACKUP_DIR/monagent.dump" || {
            # Fallback dump path used when pg_dump is installed on the runner.
            pg_dump "postgresql://postgres:postgres@localhost:5432/monagent_test" \
              --format=custom --file="$BACKUP_DIR/monagent.dump"
          }
          sha256sum "$BACKUP_DIR/monagent.dump" | tee "$BACKUP_DIR/monagent.dump.sha256"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE backup_restore_probe"
          pg_restore --clean --if-exists --no-owner --dbname="$DATABASE_URL" "$BACKUP_DIR/monagent.dump"
          restored="$(psql "$DATABASE_URL" -Atc "SELECT payload FROM backup_restore_probe WHERE id = 1")"
          test "$restored" = "restore-ok"

      - name: API health and concurrent latency smoke test
        env:
          ENVIRONMENT: development
          ENABLE_DEV_AUTH: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monagent_test
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8080/health" | tee /tmp/health.json
          python - <<'PY'
          import concurrent.futures, json, time, urllib.request
          url = "http://127.0.0.1:8080/health"
          def once():
              started = time.perf_counter()
              with urllib.request.urlopen(url, timeout=5) as resp:
                  payload = json.load(resp)
              elapsed = (time.perf_counter() - started) * 1000
              assert resp.status == 200
              assert "status" in payload
              return elapsed
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              times = list(pool.map(lambda _: once(), range(16)))
          print("p50_ms", sorted(times)[len(times)//2])
          print("max_ms", max(times))
          assert max(times) < 2000
          PY

  frontend-nextjs:
    name: Frontend Next.js Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: monty-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monty-saas/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned ESLint tooling without changing the application lockfile
        run: |
          npm install --no-save --no-package-lock \
            eslint@9.39.1 \
            @eslint/js@9.39.1 \
            typescript-eslint@8.46.4 \
            eslint-plugin-react-hooks@7.0.1 \
            @next/eslint-plugin-next@16.0.3
      - name: Strict ESLint validation
        run: npx eslint . --max-warnings=0
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Public landing page HTTP smoke test
        run: |
          set -euo pipefail
          npm run start -- --port 3000 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:3000" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3000" | head -c 200 >/dev/null

  firestore-rules:
    name: Firestore Security Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monty-saas/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monty-saas/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install locked Firebase test dependencies
        run: npm ci
      - name: Execute Firestore emulator security suite
        run: npm test

  android-kotlin:
    name: Android Kotlin Compile & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Robolectric API 36 requires JDK 21. JDK 17 causes
      # DefaultSdkProvider.verifySupportedSdk() to throw UnsupportedOperationException.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup pinned Gradle (project has no Gradle wrapper scripts)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate and verify CI-only Android signing keystores
        shell: bash
        run: |
          set -euo pipefail

          # CI keys are disposable test credentials. Never use them to publish to Play Store.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -v -storetype JKS \
              -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA \
              -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Use one password for both JKS and private key. This avoids provider-dependent
          # PKCS12/JKS password handling and makes the CI signing input deterministic.
          rm -f ci-release.keystore
          keytool -genkeypair -noprompt -v -storetype JKS \
            -keystore ci-release.keystore -storepass ci-release-ci-only \
            -alias upload -keypass ci-release-ci-only -keyalg RSA \
            -keysize 2048 -validity 10000 \
            -dname "CN=MON-AGENT CI,O=MON-AGENT,C=FR"

          keytool -list -v -storetype JKS \
            -keystore ci-release.keystore -storepass ci-release-ci-only \
            | grep -Fq "Alias name: upload"
          keytool -list -v -storetype JKS \
            -keystore debug.keystore -storepass android \
            | grep -Fq "Alias name: androiddebugkey"

      - name: Compile Android debug, unit tests and minified release APK
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-release-ci-only
          KEY_PASSWORD: ci-release-ci-only

  ci-failure-alert:
    name: CI Failure Alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-python
      - frontend-nextjs
      - firestore-rules
      - android-kotlin
    # Alerte uniquement sur échec réel (ignore cancel concurrency).
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Open or update GitHub issue for CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const results = [
              ['backend-python', '${{ needs.backend-python.result }}'],
              ['frontend-nextjs', '${{ needs.frontend-nextjs.result }}'],
              ['firestore-rules', '${{ needs.firestore-rules.result }}'],
              ['android-kotlin', '${{ needs.android-kotlin.result }}'],
            ];
            const failed = results.filter(([, r]) => r === 'failure').map(([n, r]) => `- ${n}: ${r}`);
            const title = `CI en échec — ${context.ref.replace('refs/heads/', '')} (${context.sha.slice(0, 7)})`;
            const body = [
              '## Échec MON-AGENT CI',
              '',
              `**Branche :** \`${context.ref}\``,
              `**Commit :** \`${context.sha}\``,
              `**Acteur :** @${context.actor}`,
              `**Run :** ${runUrl}`,
              '',
              '### Jobs en échec',
              failed.join('\n') || '- (détail indisponible)',
              '',
              '### Tous les résultats',
              ...results.map(([n, r]) => `- ${n}: \`${r}\``),
              '',
              '_Issue ouverte automatiquement. Fermer après correction et run vert._',
              '',
              '<!-- monty-ci-failure-alert -->',
            ].join('\n');

            const labels = ['ci-failure', 'automated'];
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (_) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: name === 'ci-failure' ? 'B60205' : '0E8A16',
                    description: name === 'ci-failure' ? 'Échec du workflow monty-ci' : 'Ouvert par automation',
                  });
                } catch (e) {
                  core.warning(`Label ${name}: ${e.message}`);
                }
              }
            }

            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:ci-failure in:body monty-ci-failure-alert`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              const issue = found.data.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Commentaire ajouté sur #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.info(`Issue créée #${created.data.number}`);
            }

      - name: Optional Slack webhook notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL absent — notification Slack ignorée."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ["SLACK_WEBHOOK_URL"]
          text = (
              f"MON-AGENT CI en échec sur `{os.environ['GITHUB_REF_NAME']}` "
              f"({os.environ['GITHUB_SHA'][:7]}). "
              f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({"text": text}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("slack status", resp.status)
          PY
