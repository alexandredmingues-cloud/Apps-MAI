name: Monty CI — Tri-Platform Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: monty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: Backend FastAPI & Domain Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monty-saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: monty-saas/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources & run complete test suite
        env:
          ENVIRONMENT: development
          ENABLE_DEV_AUTH: "true"
        run: |
          python -m compileall -q app tests
          python -m pytest -q

  frontend-nextjs:
    name: Frontend Next.js Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monty-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: monty-saas/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

  android-kotlin:
    name: Android Kotlin Compile & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup pinned Gradle (project has no Gradle wrapper scripts)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate CI-only Android debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \\
              -keystore debug.keystore \\
              -storepass android \\
              -alias androiddebugkey \\
              -keypass android \\
              -keyalg RSA -keysize 2048 -validity 10000 \\
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compile Android & run JVM unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest
